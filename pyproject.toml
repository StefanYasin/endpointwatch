[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endpointwatch"
version = "1.0.0"
description = "Live-response endpoint monitoring for Windows: processes, connections, persistence, VirusTotal/AbuseIPDB enrichment, plain-English LLM alerts"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "License.txt" }
authors = [{ name = "Stefan Yasin", email = "StefanYasin@gmail.com" }]
keywords = ["endpoint-monitoring", "dfir", "security", "monitoring", "windows", "virustotal", "abuseipdb", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "psutil>=5.9.8",
  "feedparser>=6.0.11",
  "requests>=2.31.0",
  "openai>=1.40.3",
  "playsound>=1.3.0",
]

[project.optional-dependencies]
dev = ["flake8>=7.1.1"]

[project.scripts]
endpointwatch = "main:main"

[project.urls]
Homepage = "https://github.com/StefanYasin/endpointwatch"
Source = "https://github.com/StefanYasin/endpointwatch"

[tool.hatch.build]
exclude = ["tests/**", "config/**", "SQSM Banner.html", "**/__pycache__/**", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "notifications", "database", "gui"]
modules = ["main"]
