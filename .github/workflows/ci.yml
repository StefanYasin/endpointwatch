name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install --no-deps -e .

      - name: Syntax check
        run: python -m compileall -q core modules notifications database gui main.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Import smoke test
        run: python -c "from core.rules_engine import RulesEngine; from core.evidence_exporter import EvidenceExporter; RulesEngine().match('process', 'mimikatz.exe')"